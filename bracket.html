<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height:100%; overflow:hidden; }

body {
  background: #0a0e17;
  color: #d0d8e8;
  font-family: 'Segoe UI','Microsoft YaHei','PingFang SC',sans-serif;
  font-size: 14px;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ── Header ── */
header {
  flex-shrink: 0;
  background: linear-gradient(135deg,#1a3a5c 0%,#1e4976 50%,#15304d 100%);
  border-bottom: 3px solid #c78a08;
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  z-index: 10;
}
.logo { display:flex; align-items:center; gap:12px; }
.logo-icon { font-size:26px; }
.logo h1 { font-size:22px; font-weight:800; color:#ffd54f; letter-spacing:0.5px; }
.logo span { font-size:12px; color:rgba(255,255,255,0.6); display:block; }
.header-link {
  color:rgba(255,255,255,0.8); text-decoration:none; font-size:13px;
  padding:6px 14px; border:1px solid rgba(255,255,255,0.3);
  border-radius:5px; transition:all 0.2s; white-space:nowrap;
}
.header-link:hover { background:rgba(255,255,255,0.1); color:#fff; }

/* ── Scroll container: takes all remaining height ── */
.bracket-scroll {
  flex: 1;
  overflow-x: auto;
  overflow-y: auto;
  min-height: 0;
}

/* Custom scrollbar */
.bracket-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.bracket-scroll::-webkit-scrollbar-track { background: #0a0e17; }
.bracket-scroll::-webkit-scrollbar-thumb { background: #2a3a5a; border-radius: 4px; }
.bracket-scroll::-webkit-scrollbar-thumb:hover { background: #4a6a8a; }
.bracket-scroll::-webkit-scrollbar-corner { background: #0a0e17; }

/* ── Bracket layout ── */
.bracket {
  display: inline-block;
  min-width: max-content;
  padding: 12px 10px 16px;
}

/* ── R32 merged header (spans col 4–5 via ::before on .lbl-row) ── */
/* Col widths for reference (must match grid-template-columns below):
   1:108px  2:108px  3:108px  4:128px  5:128px  6:130px  7:110px  8:100px  9:100px  10:130px  11:120px */

/* CSS Grid: 11 columns (champions moved to col 11) */
.bracket-grid {
  display: grid;
  /* Groups   Groups   Groups   R32U   R32L   R16   QF   SF   3RD  Final  Champ */
  grid-template-columns:
    108px     108px    108px    128px  128px  130px  110px  100px  100px  130px  120px;
  grid-template-rows: 28px 28px auto;
  gap: 0;
  align-items: start;
  position: relative;   /* needed for .lbl-row ::before positioning */
}

/* ── Label rows ── */
.lbl-row {
  display: contents;  /* children are grid items */
}
.lbl-merge {
  grid-column: span 2;
}

/* ── Label row ── */
.lbl {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.68em;
  font-weight: 700;
  color: #c78a08;            /* ── amber/gold – matches header border & R32 banner ── */
  text-transform: uppercase;
  letter-spacing: 0.06em;
  text-align: center;
  padding: 0 4px;
  /* no border, no background – all 11 label cells are identical */
  height: 28px;
  white-space: nowrap;
}
.lbl-sub {
  font-size: 0.68em;
  font-weight: 700;
  color: #c78a08;            /* same family, slightly dimmer */
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* ── Champion results column ── */
.col-champ {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 4px 4px;
  min-height: 680px;
  border-left: 1px solid #1f2a3a;
}
.champ-wrap {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  flex: 1;
  min-height: 0;
}

/* ── Content columns (flex, space-around for centering) ── */
.col-g, .col-ko {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  padding: 4px 4px;
  min-height: 680px;
  border-left: 1px solid #1f2a3a;
}
.col-g:first-child { border-left: none; } /* not used but safe */

/* Group sub-column (inside the Groups block) */
.g-sub {
  display: flex;
  flex-direction: column;
  justify-content: space-around;
  flex: 1;
}

/* ── Match card ── */
.bm {
  background: #0f1420;
  border: 1px solid #1e2d47;
  border-radius: 4px;
  padding: 4px 5px;
  font-size: 0.78em;
  line-height: 1.3;
  transition: border-color 0.2s;
  flex-shrink: 0;
  /* Fixed height keeps all cards same size in each column */
  height: 68px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.bm:hover { border-color: #3a5a8a; }
.bm.live { border-color: #d32f2f; }
.bm.done { border-color: #1e3a1e; }
.bm.final {
  background: linear-gradient(135deg,#1a1828,#0f1118);
  border-color: #5a4a20;
  border-width: 1.5px;
  height: 62px;
}
.bm.final:hover { border-color: #e8b820; box-shadow: 0 0 12px rgba(232,184,20,0.15); }

.bm-hdr {
  display: flex;
  gap: 3px;
  align-items: center;
  margin-bottom: 2px;
}
.bm-n { font-size: 0.72em; color: #4a6d99; min-width: 44px; flex-shrink: 0; }
.bm-t {
  font-size: 0.68em;
  color: #5a7a9a;
  white-space: normal;
  overflow: visible;
  line-height: 1.2;
}
.bj-note { font-size: 0.6em; color: #c78a08; }

.bm-r { display: flex; align-items: center; gap: 2px; margin: 1px 0; }
.bp { font-size: 0.72em; min-width: 16px; text-align: center; flex-shrink: 0; }
.bp.w1 { color: #4caf50; }
.bp.l1 { color: #e53935; }
.bp.dr { color: #6a7a8a; }
.bt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95em; }
.bt img { vertical-align: middle; margin-right: 2px; }
.bs { font-weight: 700; min-width: 18px; text-align: right; font-family: 'Segoe UI',monospace; flex-shrink: 0; }
.bs.w { color: #4caf50; }
.bm.live .bs { color: #ff6b6b; }

/* ── Group card ── */
.gc {
  background: #0d111c;
  border: 1px solid #1a2434;
  border-radius: 3px;
  flex-shrink: 0;
  height: 68px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 3px 5px;
}
.gc-hdr {
  font-size: 0.65em; font-weight: 700; color: #4a6d99;
  text-align: center; letter-spacing: 0.05em;
  border-bottom: 1px solid #1a2434;
  padding: 1px 0 2px;
  margin-bottom: 1px;
}
.gc-r { display:flex; gap:2px; align-items:center; font-size:0.68em; padding:0 2px; }
.gc-i { font-size:0.8em; color:#4a6d99; min-width:12px; flex-shrink:0; }
.gc-t { flex:1; min-width:0; overflow:visible; white-space:normal; line-height:1.2; }
.gc-t img { vertical-align:middle; margin-right:2px; }
.gc-s { font-size:0.8em; color:#5a7a9a; flex-shrink:0; }
.gc-p { font-size:0.8em; font-weight:700; color:#4da6ff; min-width:18px; text-align:right; flex-shrink:0; }


.champ {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.75em;
  padding: 3px 6px;
  flex-shrink: 0;
}
.champ.gold { background: rgba(199,138,8,0.15); border-radius: 3px; }
.champ.tbd  { opacity: 0.4; }
.ci { font-size: 1.1em; }
.ct { }
.ct img { vertical-align: middle; margin-right: 2px; }

/* ── Legend & note ── */
.foot {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 10px;
  padding: 0 6px;
  font-size: 0.68em;
  color: #3a4a5a;
}
.foot-item { display:flex; align-items:center; gap:4px; }
.foot-dot { width:7px; height:7px; border-radius:2px; flex-shrink:0; }
.foot-dot.w { background:#4caf50; }
.foot-dot.l { background:#e53935; }
.foot-dot.d { background:#4a5a6a; }
.foot-note { color:#2a3a4a; margin-left: auto; letter-spacing:0.03em; }
</style>

const MM = RAW.map(m => ({
  ...m,
  dt: new Date(m.d),
  _g: m.g ? m.g.toUpperCase() : '',
  _st: m.st || 'group',
  _bjDate: m.d.slice(0,10),
  _bjMonth: +m.d.slice(5,7),
  _bjDay: +m.d.slice(8,10),
  _bjHours: +m.d.slice(11,13),
  _bjMinutes: +m.d.slice(14,16),
  _bjWeekday: (new Date(m.d).getDay() + 1) % 7
}));
MM.sort((a,b) => a.dt - b.dt);

function fi(c) {
  if (!c || c==='TBD') return '';
  const x = CC[c]; return x ? '<img src="https://flagcdn.com/16x12/'+x+'.png" alt="" style="vertical-align:middle;margin-right:2px;" onerror="this.style.display=\'none\'">' : '';
}
function tx(c) { return (!c||c==='TBD')?'待定':(TN[c]||c); }
function ds(m) {
  const mo = (m._bjMonth !== undefined ? m._bjMonth : m.dt.getMonth()+1);
  const d = (m._bjDay !== undefined ? m._bjDay : m.dt.getDate());
  const h = (m._bjHours !== undefined ? m._bjHours : m.dt.getHours());
  const mn = (m._bjMinutes !== undefined ? m._bjMinutes : m.dt.getMinutes());
  return mo+'/'+d+' '+String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0');
}
function bjLabel(d) {
  if (!d) return '';
  return (+d.slice(5,7)) + '/' + (+d.slice(8,10)) + ' ' + d.slice(11,13) + ':' + d.slice(14,16);
}

function bm(m, cls) {
  let c = 'bm'; if (cls) c+=' '+cls; if (m.s==='live') c+=' live'; if (m.s==='done') c+=' done';
  const num = m.id||'';
  const dstr = ds(m) + ' <span class="bj-note">(北京时间 ' + bjLabel(m.d) + ')</span>';
  let hl, al;
  if (m.s==='done'&&m.sc) {
    const hs=+m.sc.h||0, as=+m.sc.a||0;
    hl = hs>as?'<span class="bp w1">胜</span>':hs<as?'<span class="bp l1">负</span>':'<span class="bp dr">平</span>';
    al = as>hs?'<span class="bp w1">胜</span>':as<hs?'<span class="bp l1">负</span>':'<span class="bp dr">平</span>';
  } else { hl='<span class="bp dr">-</span>'; al='<span class="bp dr">-</span>'; }
  let hs = (m.s==='done'&&m.sc)?(m.sc.hp!=null?m.sc.h+'('+m.sc.hp+')':m.sc.h):(m.s==='live'&&m.sc?m.sc.h:'-');
  let as = (m.s==='done'&&m.sc)?(m.sc.ap!=null?m.sc.a+'('+m.sc.ap+')':m.sc.a):(m.s==='live'&&m.sc?m.sc.a:'-');
  const hw = (m.s==='done'&&m.sc&&+m.sc.h>+m.sc.a)?' w':'';
  const aw = (m.s==='done'&&m.sc&&+m.sc.a>+m.sc.h)?' w':'';
  return '<div class="'+c+'">'+
    '<div class="bm-hdr"><span class="bm-n">'+num+'</span><span class="bm-t">'+dstr+'</span></div>'+
    '<div class="bm-r">'+hl+'<span class="bt">'+fi(m.h)+tx(m.h)+'</span><span class="bs'+hw+'">'+hs+'</span></div>'+
    '<div class="bm-r">'+al+'<span class="bt">'+fi(m.a)+tx(m.a)+'</span><span class="bs'+aw+'">'+as+'</span></div>'+
    '</div>';
}

function gc(g, teams) {
  let h = '<div class="gc"><div class="gc-hdr">Group '+g+'</div>';
  for (let j=0;j<4;j++) {
    const t = teams[j];
    const adv = j<2;
    if (t) {
      h += '<div class="gc-r">'+
        '<span class="gc-i">'+(j+1)+'</span>'+
        '<span class="gc-t">'+fi(t.c)+tx(t.c)+'</span>'+
        '<span class="gc-s">'+t.w+'-'+t.d+'-'+t.l+'</span>'+
        '<span class="gc-p">'+t.p+'</span></div>';
    } else {
      h += '<div class="gc-r"><span class="gc-i">'+(j+1)+'</span><span class="gc-t" style="color:#445">—</span><span class="gc-s">-</span><span class="gc-p">-</span></div>';
    }
  }
  h += '</div>';
  return h;
}

function standings() {
  const g={};
  for (const m of MM) {
    if (m._st!=='group'||m.h==='TBD') continue;
    const gg=m.g||''; if(!gg) continue;
    if(!g[gg]) g[gg]={};
    if(!g[gg][m.h]) g[gg][m.h]={mp:0,w:0,d:0,l:0,gf:0,ga:0,p:0};
    if(!g[gg][m.a]) g[gg][m.a]={mp:0,w:0,d:0,l:0,gf:0,ga:0,p:0};
    if(m.s==='done'&&m.sc) {
      const hs=+m.sc.h||0, as=+m.sc.a||0;
      g[gg][m.h].mp++; g[gg][m.a].mp++;
      g[gg][m.h].gf+=hs; g[gg][m.h].ga+=as;
      g[gg][m.a].gf+=as; g[gg][m.a].ga+=hs;
      const pen=m.sc.hp!=null;
      if(hs>as){g[gg][m.h].w++;g[gg][m.h].p+=3;g[gg][m.a].l++;}
      else if(hs<as){g[gg][m.a].w++;g[gg][m.a].p+=3;g[gg][m.h].l++;}
      else if(pen){
        g[gg][m.h].d++;g[gg][m.a].d++;g[gg][m.h].p++;g[gg][m.a].p++;
        if(m.sc.hp>m.sc.ap){g[gg][m.h].w++;g[gg][m.h].p+=2;g[gg][m.a].l++;}
        else{g[gg][m.a].w++;g[gg][m.a].p+=2;g[gg][m.h].l++;}
      }else{g[gg][m.h].d++;g[gg][m.a].d++;g[gg][m.h].p++;g[gg][m.a].p++;}
    }
  }
  const r={};
  for(const gg of Object.keys(g)){
    const ts=Object.keys(g[gg]).map(c=>({...g[gg][c],c,gd:g[gg][c].gf-g[gg][c].ga}));
    ts.sort((a,b)=>b.p-a.p||b.gd-a.gd||b.gf-a.gf);
    r[gg]=ts;
  }
  return r;
}

function updateMatchStatuses() {
  const now = new Date();
  for (const m of MM) {
    if (m.s === 'done') continue;
    const isKO = m._st && ['R32','R16','QF','SF','3RD','FINAL'].includes(m._st);
    const endTime = new Date(m.dt.getTime() + (isKO ? 180 : 165) * 60000);
    if (now < m.dt) m.s = 'upcoming';
    else if (now < endTime) m.s = 'live';
    else m.s = 'done';
  }
}

function champRes() {
  let fin=null, thr=null;
  for(const m of MM){if(m._st==='FINAL')fin=m;if(m._st==='3RD')thr=m;}
  const ranks=[
    {e:'🥇',t:null,gold:true},{e:'🥈',t:null},{e:'🥉',t:null}
  ];
  if(fin&&fin.s==='done'&&fin.sc){
    const hs=+fin.sc.h||0,as=+fin.sc.a||0;
    if(hs>as){ranks[0].t=fin.h;ranks[1].t=fin.a;}
    else if(as>hs){ranks[0].t=fin.a;ranks[1].t=fin.h;}
  }
  if(thr&&thr.s==='done'&&thr.sc){
    const hs=+thr.sc.h||0,as=+thr.sc.a||0;
    if(hs>as){ranks[2].t=thr.h;}
    else if(as>hs){ranks[2].t=thr.a;}
  }
  let h='<div class="champ-wrap">';
  for(const r of ranks){
    const cls='champ'+(r.gold?' gold':'')+(r.tbd?' tbd':'');
    const disp=r.t?fi(r.t)+tx(r.t):'<span style="color:#445">待定</span>';
    h+='<div class="'+cls+'"><span class="ci">'+r.e+'</span><span class="ct">'+disp+'</span></div>';
  }
  h+='</div>';
  return h;
}

function build() {
  updateMatchStatuses();
  const r32=[],r16=[],qf=[],sf=[];
  let fin=null,thr=null;
  for(const m of MM){
    const st=m._st;
    if(!st||st==='group')continue;
    if(st==='R32')r32.push(m);
    else if(st==='R16')r16.push(m);
    else if(st==='QF')qf.push(m);
    else if(st==='SF')sf.push(m);
    else if(st==='FINAL')fin=m;
    else if(st==='3RD')thr=m;
  }
  const r32u=r32.slice(0,8),r32l=r32.slice(8,16);
  const st=standings();

  // Build grid HTML
  // Row 1: labels (10 cells)
  // Row 2: content  (10 cells)
  // Groups span cols 1-3 (split into 3 sub-flex), R32U=col4, R32L=col5, R16=col6, QF=col7, SF=col8, 3RD=col9, Final+champ=col10
  let h='';

  // ── LABELS ROWS ──
  // Row 1: main headers
  h+='<div class="lbl-row">';
  h+='<div class="lbl" style="border-left:none;">小组 A-D</div>';
  h+='<div class="lbl">小组 E-H</div>';
  h+='<div class="lbl">小组 I-L</div>';
  h+='<div class="lbl lbl-merge">16分之一决赛</div>';
  h+='<div class="lbl">1/8决赛<br>R16</div>';
  h+='<div class="lbl">1/4决赛<br>QF</div>';
  h+='<div class="lbl">半决赛<br>SF</div>';
  h+='<div class="lbl">季军赛<br>3RD</div>';
  h+='<div class="lbl">🏆 决赛<br>FINAL</div>';
  h+='<div class="lbl">🏅 名次<br>RANKS</div>';
  h+='</div>';
  // Row 2: sub-headers for R32
  h+='<div class="lbl-row">';
  h+='<div class="lbl" style="border-left:none;visibility:hidden;"></div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='<div class="lbl">上半区</div>';
  h+='<div class="lbl">下半区</div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='<div class="lbl" style="visibility:hidden;"></div>';
  h+='</div>';

  // ── CONTENT ROW ──
  // Groups A-D
  h+='<div class="col-g"><div class="g-sub">';
  for(const g of['A','B','C','D']) h+=gc(g,st[g]||[]);
  h+='</div></div>';
  // Groups E-H
  h+='<div class="col-g"><div class="g-sub">';
  for(const g of['E','F','G','H']) h+=gc(g,st[g]||[]);
  h+='</div></div>';
  // Groups I-L
  h+='<div class="col-g"><div class="g-sub">';
  for(const g of['I','J','K','L']) h+=gc(g,st[g]||[]);
  h+='</div></div>';
  // R32 Upper
  h+='<div class="col-ko"><div class="g-sub">';
  for(const m of r32u) h+=bm(m);
  h+='</div></div>';
  // R32 Lower
  h+='<div class="col-ko"><div class="g-sub">';
  for(const m of r32l) h+=bm(m);
  h+='</div></div>';
  // R16
  h+='<div class="col-ko"><div class="g-sub">';
  for(const m of r16) h+=bm(m);
  h+='</div></div>';
  // QF
  h+='<div class="col-ko"><div class="g-sub">';
  for(const m of qf) h+=bm(m);
  h+='</div></div>';
  // SF
  h+='<div class="col-ko"><div class="g-sub">';
  for(const m of sf) h+=bm(m);
  h+='</div></div>';
  // 3RD
  h+='<div class="col-ko">';
  if(thr) h+=bm(thr);
  h+='</div>';
  // Final (no champions here – separated out)
  h+='<div class="col-ko">';
  if(fin) h+=bm(fin,'final');
  h+='</div>';
  // Champions (col 11 – right of Final)
  h+='<div class="col-champ">';
  h+=champRes();
  h+='</div>';

  document.getElementById('bracketRoot').innerHTML = h;
}

document.addEventListener('DOMContentLoaded', build);
</script>
